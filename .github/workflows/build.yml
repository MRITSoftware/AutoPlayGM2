name: Build AutoPlayGM2 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Reaproveita a MESMA chave de debug entre execuções do workflow.
      # Sem isso, cada run gera uma chave nova e o app instalado no celular
      # de teste passa a ser incompatível com o próximo build (erro
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE), obrigando a desinstalar toda vez.
      - name: Cache/restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: autoplaygm2-debug-keystore-v1

      # 1) Builda primeiro o app-cobaia (test-auto-app) sozinho.
      - name: Build test-auto-app APK
        run: gradle :test-auto-app:assembleDebug

      # 2) Copia o APK gerado pra dentro dos assets do installer-app.
      #    É isso que faz o installer-app virar "um APK só" pro seu amigo:
      #    ele carrega o app de teste embutido e instala sozinho, sem
      #    precisar mandar dois arquivos nem escolher nada manualmente.
      - name: Embed test-auto-app APK into installer-app assets
        run: |
          mkdir -p installer-app/src/main/assets
          cp test-auto-app/build/outputs/apk/debug/test-auto-app-debug.apk \
             installer-app/src/main/assets/test_auto_app.apk

      # 3) Builda o installer-app já com o APK embutido.
      - name: Build installer-app APK
        run: gradle :installer-app:assembleDebug

      - name: Upload AutoPlayGM2 APK (o que você manda pro seu amigo)
        uses: actions/upload-artifact@v4
        with:
          name: AutoPlayGM2
          path: installer-app/build/outputs/apk/debug/installer-app-debug.apk

      - name: Upload test-auto-app APK (opcional, pra depurar sozinho)
        uses: actions/upload-artifact@v4
        with:
          name: AutoPlayGM2-test-auto-app
          path: test-auto-app/build/outputs/apk/debug/test-auto-app-debug.apk
